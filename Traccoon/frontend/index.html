<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTrans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-bv">
<div class="mobile-container">

    <!-- TELA 0: ONBOARDING -->
    <div id="screen-onboarding" class="screen active">
        <div class="mascot-container" style="font-size: 100px;">🦝📱</div>
        <h2 style="margin-bottom: 15px;">Estude em qualquer lugar</h2>
        <p>O AutoTrans te ajuda a passar na prova da CNH com simulados divertidos e interativos.</p>
        <div class="dots">
            <span class="dot active-dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <button class="btn btn-green" style="margin-top: auto;" onclick="navigateTo('screen-welcome')">Avançar</button>
    </div>

    <!-- TELA 1: BEM-VINDO -->
    <div id="screen-welcome" class="screen">
        <div class="mascot-container">🦝</div>
        <h1 class="welcome-title">Bem-vindo<br>ao AutoTrans!</h1>
        <p class="welcome-subtitle">Aprenda a dirigir de forma<br>divertida</p>
        <div class="welcome-buttons">
            <button class="btn btn-green" onclick="navigateTo('screen-register')">Começar a Aprender</button>
            <button class="btn btn-dark-green" onclick="navigateTo('screen-login')">Já Tenho Conta</button>
        </div>
    </div>

    <!-- TELA 2: CRIAR CONTA -->
    <div id="screen-register" class="screen">
        <h2 class="title-italic">Crie sua conta</h2>
        <div class="form-group"><input type="text" id="cadastro-nome" placeholder="Nome de usuário"></div>
        <div class="form-group"><input type="email" id="cadastro-email" placeholder="E-mail"></div>
        <div class="form-group"><input type="password" id="cadastro-senha" placeholder="Senha (mínimo 4 caracteres)"></div>
        <button class="btn btn-green" onclick="cadastrarUsuario()">Continuar</button>
        <p id="cadastro-mensagem" style="color:#e53e3e;"></p>
        <p class="link-text">Já tem conta? <span onclick="navigateTo('screen-login')">Faça login</span></p>
    </div>

    <!-- TELA 3: LOGIN -->
    <div id="screen-login" class="screen">
        <h2 class="title-italic">Acesse sua conta</h2>
        <div class="form-group margin-top-20">
            <input type="email" id="login-email" placeholder="E-mail">
        </div>
        <div class="form-group">
            <input type="password" id="login-senha" placeholder="Senha">
        </div>
        <button class="btn btn-green margin-top-20" onclick="entrar()">Entrar</button>
        <p id="login-mensagem" style="color:#e53e3e;"></p>
        <p class="link-text"><span onclick="navigateTo('screen-register')">Criar nova conta</span></p>
    </div>

</div>
    <script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
