<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerir Questões — AutoTrans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-body">
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <aside class="sidebar">
        <a href="painel.html" class="sidebar-logo">🚗 AutoTrans</a>
        <nav>
            <a href="painel.html" class="sidebar-link">🏠 Início</a>
            <a href="admin_usuarios.html" class="sidebar-link">🛠️ Usuários</a>
            <a href="admin_categorias.html" class="sidebar-link">🛠️ Categorias</a>
            <a href="admin_questoes.html" class="sidebar-link">🛠️ Questões</a>
            <a href="admin_alternativas.html" class="sidebar-link">🛠️ Alternativas</a>
            <a href="admin_materiais.html" class="sidebar-link">🛠️ Materiais</a>
        </nav>
        <div class="sidebar-footer"><a href="painel.html" class="sidebar-sair">← Voltar</a></div>
    </aside>
    <label for="menu-toggle" class="sidebar-overlay"></label>
    <label for="menu-toggle" class="hamburger"><span></span><span></span><span></span></label>

    <div class="mobile-container">
    <div class="conteudo-pagina" style="padding: 30px 25px;">
        <h2 style="text-align:left;" id="titulo-formulario">Cadastrar Questão</h2>

        <form id="form-questao">
            <input type="hidden" id="questao-id">
            <div class="form-grupo">
                <label>Enunciado</label>
                <textarea id="enunciado" rows="3" required></textarea>
            </div>
            <div class="form-grupo">
                <label>Categoria</label>
                <select id="categoria_id" required></select>
            </div>
            <button type="submit" id="botao-salvar" class="btn">Salvar</button>
            <button type="button" id="botao-cancelar" class="btn btn-dark-green">Cancelar edição</button>
        </form>
        <p id="mensagem"></p>

        <h3 style="text-align:left; margin-top:30px;">Questões cadastradas</h3>
        <div class="tabela-responsiva">
            <table>
                <tr><th>ID</th><th>Enunciado</th><th>Categoria</th><th>Ações</th></tr>
                <tbody id="tabela-questoes"><tr><td colspan="4">Carregando...</td></tr></tbody>
            </table>
        </div>
        <div id="paginacao-questoes" class="paginacao"></div>
    </div>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/paginacao.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-guard.js"></script>
    <script src="../js/admin_questoes.js"></script>
</body>
</html>
